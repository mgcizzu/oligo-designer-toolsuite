#######################
### USER PARAMETERS ###
#######################

### General parameters
### -----------------------------------------------
n_jobs: 4
dir_output: output_custom_sequence_scrinshot_iss_probe_designer
write_intermediate_steps: true
top_n_sets: 3

### Custom Target Probe Parameters
### -----------------------------------------------
file_regions: null
allow_multiple_target_sequences: false
files_fasta_target_probe_database:
  - data/genomic_regions/custom_sequence_reporter_example.fna
files_fasta_reference_database_target_probe:
  - data/genomic_regions/exon_annotation_source-NCBI_species-Homo_sapiens_annotation_release-110_genome_assemly-GRCh38.fna
  - data/genomic_regions/exon_exon_junction_annotation_source-NCBI_species-Homo_sapiens_annotation_release-110_genome_assemly-GRCh38.fna
target_probe_length_min: 40
target_probe_length_max: 45
target_probe_GC_content_min: 40
target_probe_GC_content_opt: 50
target_probe_GC_content_max: 60
target_probe_Tm_min: 65
target_probe_Tm_opt: 70
target_probe_Tm_max: 75
target_probe_homopolymeric_base_n:
  A: 5
  T: 5
  C: 5
  G: 5
target_probe_padlock_arm_Tm_dif_max: 2
target_probe_padlock_arm_length_min: 10
target_probe_padlock_arm_Tm_min: 50
target_probe_padlock_arm_Tm_max: 60
target_probe_ligation_region_size: 5
target_probe_isoform_weight: 0
target_probe_GC_weight: 1
target_probe_Tm_weight: 1
set_size_min: 3
set_size_opt: 5
distance_between_target_probes: 0
n_sets: 100

### Detection Oligo Parameters
### -----------------------------------------------
detection_oligo_min_thymines: 2
detection_oligo_length_min: 15
detection_oligo_length_max: 40
detection_oligo_U_distance: 5
detection_oligo_Tm_opt: 56

############################
### DEVELOPER PARAMETERS ###
############################

### Transcriptome zero-hit BLASTN filter
### -----------------------------------------------
target_probe_specificity_blastn_search_parameters:
  perc_identity: 80
  strand: "minus"
  word_size: 10
  dust: "no"
  soft_masking: "false"
  max_target_seqs: 10
  max_hsps: 1000
target_probe_specificity_blastn_hit_parameters:
  coverage: 50

### Present for compatibility with shared Scrinshot developer parameters; unused here.
target_probe_cross_hybridization_blastn_search_parameters:
  perc_identity: 80
  strand: "minus"
  word_size: 10
  dust: "no"
  soft_masking: "false"
  max_target_seqs: 10
target_probe_cross_hybridization_blastn_hit_parameters:
  coverage: 80

### Parameters for oligo set selection
### -----------------------------------------------
max_graph_size: 5000
n_attempts: 100000
heuristic: true
heuristic_n_attempts: 100

### Parameters for melting temperature
### -----------------------------------------------
target_probe_Tm_parameters:
    nn_table: DNA_NN3
    tmm_table: DNA_TMM1
    imm_table: DNA_IMM1
    de_table: DNA_DE1
    dnac1: 50
    dnac2: 0
    saltcorr: 7
    Na: 39
    K: 75
    Tris: 20
    Mg: 10
    dNTPs: 0
target_probe_Tm_chem_correction_parameters:
    DMSO: 0
    DMSOfactor: 0.75
    fmd: 20
    fmdfactor: 0.65
    fmdmethod: 1
    GC: null
target_probe_Tm_salt_correction_parameters: null

detection_oligo_Tm_parameters:
    nn_table: DNA_NN3
    tmm_table: DNA_TMM1
    imm_table: DNA_IMM1
    de_table: DNA_DE1
    dnac1: 50
    dnac2: 0
    saltcorr: 7
    Na: 39
    K: 0
    Tris: 0
    Mg: 0
    dNTPs: 0
detection_oligo_Tm_chem_correction_parameters:
    DMSO: 0
    DMSOfactor: 0.75
    fmd: 30
    fmdfactor: 0.65
    fmdmethod: 1
    GC: null
detection_oligo_Tm_salt_correction_parameters: null

### ISS backbone
### -----------------------------------------------
padlock_backbone:
  anchor_sequence: TGCGTCTATTTAGTGGAGCC
  gene_specific_sequence: ACGTACGTACGTACGTACGT
  direct_lbar_id: custom_reporter
  file_gene_to_lbar: null
  file_lbar_to_sequence: null
  gene_column: Gene
  lbar_id_column_gene_table: Lbar_ID
  lbar_id_column_sequence_table: Lbar_ID
  lbar_sequence_column: Sequence

probe_flanks:
  enabled: false
  files_fasta_target_context:
    - data/genomic_regions/custom_sequence_reporter_example.fna
  flank_5prime_length: 20
  flank_3prime_length: 20
  flank_5prime_distance: 0
  flank_3prime_distance: 0
