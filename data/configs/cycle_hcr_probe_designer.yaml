#######################
### USER PARAMETERS ###
#######################

### General parameters
### -----------------------------------------------
n_jobs: 4 # number of cores used to run the pipeline and 2*n_jobs +1 regions can be cached at once; reduce if memory is limiting
dir_output: output_cycle_hcr_probe_designer # directory where output files will be written
write_intermediate_steps: true # if true, writes intermediate probe tables after each major step
top_n_sets: 3 # maximum number of ranked sets reported in final output tables


### Input files
### -----------------------------------------------
file_regions: data/genes/custom_3.txt # file with the target genes/transcripts; leave empty if all regions are used
files_fasta_target_probe_database: # transcript FASTA file(s) from which CycleHCR 92-nt windows are generated
  - data/genomic_regions/gene_annotation_source-NCBI_species-Homo_sapiens_annotation_release-110_genome_assemly-GRCh38.fna
files_fasta_reference_database_target_probe: # transcriptome FASTA file(s) used for specificity checks
  - data/genomic_regions/gene_annotation_source-NCBI_species-Homo_sapiens_annotation_release-110_genome_assemly-GRCh38.fna

barcode_library:
  file: /Users/marcogrillo/Desktop/TracMan/TracMan_200k/Constructs_V7.1_work/HCR_barcodes.xlsx # workbook with barcode sheets such as hcr488_B4, hcr561_B2, hcr640_B3
  sheets: # allowed barcode sheets for this panel
    - hcr488_B4
    - hcr561_B2
    - hcr640_B3

barcode_assignment:
  file: data/barcodes/cycle_hcr_gene_barcode_assignment.csv # explicit gene-to-barcode mapping
  gene_column: Gene
  sheet_column: Sheet
  left_barcode_name_column: Left_Barcode_Name
  right_barcode_name_column: Right_Barcode_Name
  require_unique_barcode_combination: true # do not reuse the same sheet/left/right combination across genes in one panel
  require_same_sheet_for_left_right: true # left and right barcode names for one gene must come from the same sheet


### Target selection
### -----------------------------------------------
target_probe_length_min: 45 # each CycleHCR half-probe binds 45 nt
target_probe_length_max: 45 # each CycleHCR half-probe binds 45 nt
target_probe_isoform_consensus: 50 # placeholder default until a stricter CycleHCR-specific isoform rule is defined
target_probe_GC_content_min: 30 # minimum GC content of each 45-nt half-probe
target_probe_GC_content_opt: 60 # scoring midpoint inside the accepted GC range
target_probe_GC_content_max: 90 # maximum GC content of each 45-nt half-probe
target_probe_Tm_min: 0 # no lower DNA:DNA Tm cutoff; RNA-binding stability is handled by cycle_hcr.min_dna_rna_tm_estimate
target_probe_Tm_opt: 72 # scoring midpoint for DNA:DNA Tm
target_probe_Tm_max: 76 # maximum DNA:DNA Tm of each 45-nt half-probe
target_probe_homopolymeric_base_n: # reject sequences containing 6 consecutive identical nucleotides
  A: 6
  T: 6
  C: 6
  G: 6
target_probe_T_secondary_structure: 76 # temperature at which secondary structure free energy is evaluated
target_probe_secondary_structures_threshold_deltaG: 0 # reject probes that still form stable secondary structures at this temperature
target_probe_apply_cross_hybridization: true # apply transcriptome-wide cross-hybridization filtering
target_probe_GC_weight: 1 # weight of GC content in target-probe scoring
target_probe_Tm_weight: 1 # weight of DNA:DNA Tm in target-probe scoring
target_probe_isoform_weight: 2 # weight of isoform consensus in target-probe scoring
set_size_min: 10 # minimum number of accepted probe pairs per target
set_size_opt: 25 # optimal number of accepted probe pairs per target
distance_between_target_probes: 5 # minimum spacing between accepted 92-nt windows
n_sets: 100 # maximum number of ranked sets to generate


### CycleHCR geometry and filtering
### -----------------------------------------------
cycle_hcr:
  selection_mode: sliding_window # slide a 92-nt window across each transcript and score valid windows
  window_length: 92 # full target window length
  left_probe_length: 45 # first targeted segment in the 92-nt window
  inter_probe_gap_length: 2 # untargeted internal gap
  right_probe_length: 45 # last targeted segment in the 92-nt window

  max_secondary_structure_tm: 76 # reject candidate windows if either 45-mer exceeds this secondary-structure threshold
  max_cross_hybridization_tm: 72 # reject candidate windows if either 45-mer exceeds this cross-hybridization threshold
  enable_cross_hybridization_tm_screen: false # optional transcriptome-wide seed-indexed off-target Tm screen; can be slow on large references
  cross_hybridization_seed_length: 12 # exact-seed length used to identify transcriptome windows for optional off-target Tm evaluation

  min_dna_rna_tm_estimate: 90 # minimum estimated RNA:DNA binding Tm for each 45-mer
  dna_rna_tm_estimate_offset: 10 # conservative estimate: Tm(probe:RNA) = Tm(probe:DNA) + 10 C

  junction_length: 26 # unique sequence used for the final transcriptome-wide specificity check
  junction_reference_scope: transcriptome # use transcriptome instead of genomic DNA for the final junction uniqueness filter
  junction_max_reference_matches: 1 # retain only probe pairs whose junction sequence matches once in the reference


### Output assembly
### -----------------------------------------------
output_modes: # choose one or both output assemblies
  - direct
  - twist_pcr_t7_rt

direct_primary:
  spacer: TT
  left_probe_order:
    - target_left_reverse_complement
    - spacer
    - left_barcode_full
  right_probe_order:
    - right_barcode_full
    - spacer
    - target_right_reverse_complement

twist_pcr_t7_rt:
  forward_primer_with_t7: TAATACGACTCACTATAGCGTCATC
  reverse_primer_sequence: CGACACCGAACGTGCGACAA
  spacer: TT

  left_barcode_subsequence:
    source: left_barcode
    side: terminal
    length: 14

  right_barcode_subsequence:
    source: right_barcode
    side: leading
    length: 14

  left_probe_order:
    - forward_primer_with_t7
    - target_left_sense
    - spacer
    - left_barcode_subsequence
    - reverse_primer_sequence

  right_probe_order:
    - forward_primer_with_t7
    - right_barcode_subsequence
    - spacer
    - target_right_sense
    - reverse_primer_sequence


############################
### DEVELOPER PARAMETERS ###
############################

### Target Probe Parameters
### -----------------------------------------------
target_probe_specificity_blastn_search_parameters:
  perc_identity: 80 # the higher the percent identity is, the more significant the match
  strand: "minus" # strand-restricted antisense search for transcriptome specificity
  word_size: 10
  dust: "no"
  soft_masking: "false"
  max_target_seqs: 10
  max_hsps: 1000
target_probe_specificity_blastn_hit_parameters:
  min_alignment_length: 17 # generic fallback until CycleHCR-specific transcriptome specificity logic is implemented
target_probe_cross_hybridization_blastn_search_parameters:
  perc_identity: 80
  strand: "minus"
  word_size: 7
  dust: "no"
  soft_masking: "false"
  max_target_seqs: 10
target_probe_cross_hybridization_blastn_hit_parameters:
  min_alignment_length: 17 # generic fallback; CycleHCR additionally defines a Tm-based threshold above
target_probe_Tm_parameters:
  nn_table: DNA_NN3
  tmm_table: DNA_TMM1
  imm_table: DNA_IMM1
  de_table: DNA_DE1
  dnac1: 50 #[nM]
  dnac2: 0 #[nM]
  saltcorr: 7
  Na: 1000 #[mM] # 1 M salt, matching the CycleHCR target-selection description
  K: 0 #[mM]
  Tris: 0 #[mM]
  Mg: 0 #[mM]
  dNTPs: 0 #[mM]
target_probe_Tm_chem_correction_parameters: null # formamide handling for CycleHCR needs to be implemented explicitly if required
target_probe_Tm_salt_correction_parameters: null
max_graph_size: 5000 # maximum number of oligos taken into consideration during set selection
n_attempts: 100000 # number of attempts to find the optimal set of oligos
heuristic: true # apply heuristic pre-search to reduce search space and runtime
heuristic_n_attempts: 100 # number of attempts in heuristic pre-search
